name: pennypal
description: "PennyPal - Student Personal Finance Management Application (Fresh All Along)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ---------- Firebase ----------
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_messaging: ^15.1.5
  google_sign_in: ^6.2.2

  # ---------- State management & routing ----------
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # ---------- UI / animation ----------
  flutter_animate: ^4.5.0
  lottie: ^3.2.0
  rive: ^0.13.20
  fl_chart: ^0.69.2
  google_fonts: ^6.2.1
  confetti: ^0.8.0

  # ---------- Device features ----------
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  google_mlkit_text_recognition: ^0.14.0
  google_mlkit_barcode_scanning: ^0.13.0
  speech_to_text: ^7.0.0

  # ---------- Reporting ----------
  pdf: ^3.11.1
  printing: ^5.13.4

  # ---------- Storage / utils ----------
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  uuid: ^4.5.1
  connectivity_plus: ^7.3.1

  # ---------- Networking / AI ----------
  http: ^1.6.0
  flutter_dotenv: ^5.2.1
  sqflite: ^2.4.4
  path_provider: ^2.1.6
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/lottie/
